<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>החקלאים באים לראדא</title>
<meta name="description" content="יריד תוצרת ישראלית ישירות מהחקלאים בחברת ראדא">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#26362a;--green:#55755b;--light:#f5f1e8;--cream:#fbfaf6;--gold:#c79d45;--line:#e6e0d3}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Heebo,Arial,sans-serif}
.hero{background:linear-gradient(135deg,#eef3e8,#fbfaf6);padding:42px 20px 32px;text-align:center;border-bottom:1px solid var(--line)}
.logo{font-size:44px;margin-bottom:4px}.hero h1{font-family:Rubik,sans-serif;font-size:clamp(32px,7vw,58px);margin:0 0 6px}.hero .sub{font-size:21px;font-weight:600}.hero p{max-width:700px;margin:12px auto 0;font-size:17px;line-height:1.65}
.admin{position:absolute;left:16px;top:16px;text-decoration:none;color:var(--green);font-size:13px}
.event{max-width:1050px;margin:-1px auto 0;padding:22px 20px}.eventbox{background:white;border:1px solid var(--line);border-radius:22px;padding:20px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;box-shadow:0 8px 30px rgba(50,50,30,.05)}
.eventitem{text-align:center}.eventitem b{display:block;font-size:14px;color:#7b816f}.eventitem span{font-size:18px;font-weight:700}.notice{margin-top:14px;background:#f1ead9;border-radius:16px;padding:13px 17px;text-align:center;line-height:1.55}
main{max-width:1100px;margin:auto;padding:10px 20px 60px}.section-title{text-align:center;font-family:Rubik,sans-serif;font-size:28px;margin:28px 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:white;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 7px 24px rgba(50,50,30,.06);display:flex;flex-direction:column}.photo{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee8da}.placeholder{display:flex;align-items:center;justify-content:center;font-size:54px;background:linear-gradient(135deg,#eee9dc,#e1e7dc)}
.cardbody{padding:19px 20px 20px}.tag{display:inline-block;background:#edf2e8;color:#4d6a51;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;margin-bottom:9px}.card h3{font-family:Rubik,sans-serif;font-size:23px;margin:0 0 5px}.loc{color:#777;font-size:14px}.desc{font-size:16px;line-height:1.6;margin:10px 0 6px}.products{white-space:pre-line;font-weight:600;line-height:1.7;margin:7px 0 12px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{flex:1;min-width:125px;text-align:center;text-decoration:none;padding:10px 14px;border-radius:12px;font-weight:700;border:1px solid var(--green)}.primary{background:var(--green);color:#fff}.secondary{color:var(--green);background:#fff}.disabled{background:#eee;color:#888;border-color:#ddd;cursor:default}
.gallery{position:relative;background:#eee8da}.gallery .photo{display:block;width:100%;height:100%;object-fit:contain}.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.85);font-size:25px;cursor:pointer;z-index:2}.gallery-prev{right:10px}.gallery-next{left:10px}
 footer{background:#26362a;color:#fff;text-align:center;padding:30px 20px;font-size:15px;line-height:1.7}
@media(max-width:720px){.eventbox{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.admin{position:static;display:inline-block;margin-bottom:12px}.hero{padding-top:25px}.logo{font-size:36px}}
</style>
</head>
<body>
<header class="hero">
<a class="admin" href="/admin/">✏️ עריכת האתר</a>
<div class="logo"><img src="/images/LOGOERAN.jpg" alt="לוגו"></div>
<h1 id="title">החקלאים באים לראדא</h1>
<div class="sub" id="subtitle"></div>
<p id="intro"></p>
</header>
<section class="event">
<div class="eventbox">
<div class="eventitem"><b>📅 מתי?</b><span id="date"></span></div>
<div class="eventitem"><b>🕐 שעות</b><span id="time"></span></div>
<div class="eventitem"><b>📍 איפה?</b><span id="location"></span></div>
</div>
<div class="notice" id="notes"></div>
</section>
<main>
<h2 class="section-title">🌿 מי מחכה לכם ביריד?</h2>
<div class="grid" id="grid"></div>
</main>
<footer>החקלאים באים ❤️<br>תוצרת ישראלית, קשר ישיר ותמיכה בחקלאים ובעסקים מקומיים.</footer>
<script>
fetch('/content/site.json').then(r=>r.json()).then(data=>{
 const e=data.event;
 window.farmers=data.farmers;
 for(const [id,val] of [['title',e.title],['subtitle',e.subtitle],['intro',e.intro],['date',e.date],['time',e.time],['location',e.location],['notes',e.notes]]) document.getElementById(id).textContent=val||'';
 const grid=document.getElementById('grid');
 data.farmers.forEach(f=>{
   const card=document.createElement('article'); card.className='card';
const imgs=f.images&&f.images.length?f.images:(f.image?[f.image]:[]); const media=imgs.length?`<div class="gallery"><img class="photo gallery-img" src="${imgs[0]}" alt="${esc(f.name)}">${imgs.length>1?`<button class="gallery-arrow gallery-prev" onclick="galleryMove(this,-1)">›</button><button class="gallery-arrow gallery-next" onclick="galleryMove(this,1)">‹</button>`:''}</div>`:`<div class="photo placeholder"><img src="/images/LOGOERAN.jpg" alt="לוגו"></div>`;   const info=f.info_url ? `<a class="btn secondary" href="${f.info_url}" target="_blank" rel="noopener">🌱 למידע / היכרות</a>` : '';
   const order=f.order_url ? `<a class="btn primary" href="${f.order_url}" target="_blank" rel="noopener">🛒 להזמנה מראש</a>` : `<span class="btn disabled">📦 הזמנה מראש</span>`;
   card.innerHTML=`${media}<div class="cardbody"><div class="tag">${esc(f.category)}</div><h3>${esc(f.emoji||'')} ${esc(f.name)}</h3>${f.location?`<div class="loc">${esc(f.location)}</div>`:''}<div class="desc">${esc(f.description||'')}</div>${f.products?`<div class="products">${esc(f.products)}</div>`:''}<div class="actions">${order}${info}</div></div>`;
   grid.appendChild(card);
 });
});
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function galleryMove(btn,dir){const g=btn.parentElement;const img=g.querySelector('.gallery-img');const card=g.closest('.card');const fName=card.querySelector('h3').textContent.trim();const data=window.farmers||[];const f=data.find(x=>(x.emoji||'')+' '+x.name===fName);if(!f||!f.images||f.images.length<2)return;let i=Number(img.dataset.index||0);i=(i+dir+f.images.length)%f.images.length;img.src=f.images[i];img.dataset.index=i;}
</script>
</body>
</html>
